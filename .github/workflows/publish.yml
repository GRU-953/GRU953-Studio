name: Publish

# Triggered by pushing a version tag (v5.0.1, v5.1.0, etc.) — never by an
# ordinary push to main, so publishing a new version is always a deliberate,
# separate act from merging code.
#
# Three independent jobs, each gated behind its own GitHub Environment
# (publish-npm-cli; the antigravity and vscode-marketplace jobs were removed in v7.0.0).
# An Environment with required reviewers configured (Settings > Environments
# in the GitHub UI, or the API — this workflow file only names the
# environment; the actual reviewer requirement is repo configuration, not
# something expressible here) makes GitHub pause each job and wait for a
# human to click Approve before it runs — three separate approvals for one
# tag push, matching the plan's own rule that "each first publish gets its
# own explicit confirmation at the time, never bundled into a general
# approval." Until those three Environments are created with a reviewer set,
# every job here has an effectively empty approval gate and pushing a tag
# would trigger a real publish attempt with no pause — so do not push a
# version tag until the three Environments exist. See CONTRIBUTING.md's
# publishing section for the exact one-time setup steps.
#
# Uses npm's Trusted Publishing (generally available since npm CLI 11.5.1):
# the workflow proves its identity to npm via GitHub's own OIDC token
# (`permissions: id-token: write`, job-scoped only — never repository-wide,
# and never added to ci.yml or codeql.yml), so no npm access token is ever
# created, stored as a secret, or capable of leaking. This requires the
# package (and this repo) to already be public, which both already are, and
# requires the npm package to be configured on npmjs.com to trust this exact
# workflow file and repo before the first publish — done once, on npmjs.com,
# by whoever owns the @gru953 npm account.
#
# The VS Code Marketplace side still needs a real secret (VSCE_PAT) — the
# Marketplace has no OIDC/trusted-publishing equivalent yet. See
# CONTRIBUTING.md for how that token is created and added.

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # 2026-08-26, finding X376. Until v7.0.0 this workflow had NO `needs:` anywhere and referenced
  # none of the plugin's own gates: pushing a `v*.*.*` tag published straight to npm with nothing
  # checked. CI runs nine gate steps and a 650-plus-test suite on every push and pull request, and the
  # release path — the one that reaches other people's machines — ran none of them.
  #
  # This RE-RUNS them against the tagged tree rather than looking up CI's conclusion for the
  # commit. That is deliberate: a tag can be pushed at any commit, including one CI never saw, and
  # a Checks API lookup that finds no run is easy to misread as a run that passed. Re-running costs
  # a few minutes on a release and cannot be satisfied by an absence.
  #
  # The commands are the ones CLAUDE.md documents for every commit, kept in the same order, so a
  # contributor reading either place sees the same list.
  # 2026-08-27, Stage 6. The nine deterministic gates below prove the machinery is sound. They
  # cannot prove the PRODUCT works, because none of them builds anything — that is what this job
  # is for, and the owner's decision is that no release is published without it.
  #
  # `require-measurement: true` is the load-bearing input. Called without it, e2e.yml ends GREEN
  # when no ANTHROPIC_API_KEY is configured, deliberately: a nightly that is always red is an
  # alert nobody reads. Wiring `needs:` to that behaviour would publish a release on a pass that
  # measured nothing — which is the same defect as a Definition of Done written by the work it
  # grades, and this release exists to remove that defect, not relocate it. With the input set,
  # a missing secret fails the release instead.
  #
  # 120 minutes, not the nightly's 90: the release brief is Tiny Tier, whose best measured run was
  # 71 minutes, and a release should not fail on a slow queue. GitHub's job ceiling is 360.
  e2e:
    name: the product actually builds something (must pass before anything is published)
    uses: ./.github/workflows/e2e.yml
    secrets: inherit
    with:
      require-measurement: true
      timeout-minutes: '120'

  gates:
    name: gates (must pass before anything is published)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install repo dev tooling (ESLint, Prettier — dev-only, never shipped)
        run: npm ci
      - name: Syntax-check every hook script
        run: |
          for f in plugins/gru953-studio/hooks/*.mjs; do node --check "$f"; done
      - name: Behavioural test suite
        run: node plugins/gru953-studio/hooks/hooks.test.mjs
      - name: Repository integrity check
        run: node plugins/gru953-studio/hooks/repo-integrity.mjs .
      - name: Roster check
        run: node plugins/gru953-studio/hooks/roster-check.mjs plugins/gru953-studio .
      - name: Licence scan
        run: node plugins/gru953-studio/hooks/licence-scan.mjs .
      - name: Documentation-consistency check
        run: node plugins/gru953-studio/hooks/docs-consistency.mjs .
      - name: Operating-charter consistency check
        run: node plugins/gru953-studio/hooks/charter-check.mjs .
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check

  publish-npm-cli:
    name: Publish @gru953/studio-cli to npm
    needs: [gates, e2e]
    runs-on: ubuntu-latest
    environment: publish-npm-cli
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure npm is new enough for Trusted Publishing (11.5.1+)
        run: npm install -g npm@latest
      # 2026-08-07 audit fix. The v5.1.3 tag was pushed while every
      # package.json in the repo still said 5.1.2, so the "already published"
      # check below saw a live version and skipped the publish in silence —
      # a tag that shipped nothing and reported success. The tag is the
      # human's stated intent; package.json is what actually gets published.
      # If they disagree, that is always a mistake, so fail loudly here
      # rather than let the skip path swallow it.
      - name: Tag must match this package's version
        working-directory: clients/cli
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VER" ]; then
            echo "Tag v$TAG does not match clients/cli/package.json version $VER." >&2
            echo "Bump the version (and every other manifest) before tagging, or delete and re-push the correct tag." >&2
            exit 1
          fi
          echo "Tag v$TAG matches clients/cli/package.json."
      - name: Install dependencies
        working-directory: clients/cli
        run: npm ci
      - name: Run the same tests and lint CI already requires
        working-directory: clients/cli
        run: |
          npm test
          npm run lint
      - name: Check if this version is already published
        id: check
        working-directory: clients/cli
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "::notice::$PKG@$VER is already on npm — a tag was likely re-pushed (e.g. after re-signing). Skipping, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.check.outputs.exists == 'false'
        working-directory: clients/cli
        run: npm publish --access public

  # v7.0.0 removed two publish jobs from here: publish-npm-antigravity, which pushed
  # @gru953/studio-antigravity to npm, and publish-vscode-marketplace, which pushed the VS
  # Code extension. Both packages were deleted with the host adapters. The Antigravity one
  # had never worked in any case: its published tarball carried no copy of the plugin its
  # own code resolves at runtime, so every published version of it was uninstallable.
  #
  # Neither name can be deleted from a registry, only deprecated — see MIGRATION.md.

  release-assets:
    name: Build and attach the downloadable installers
    # The release attachments are what a person downloads from the release page, so they are
    # gated exactly like the npm publish: no asset is attached to a release built from a tree
    # that has not passed the plugin's own checks.
    needs: [gates, e2e]
    runs-on: ubuntu-latest
    permissions:
      # Job-scoped only, never repository-wide — the same discipline the
      # id-token permission above follows. This is the single job here that
      # writes anything back to the repository.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # Same check the three publish jobs run, for the same reason: a tag that
      # disagrees with the manifest would otherwise attach assets labelled with a
      # version nobody released.
      - name: Tag must match the plugin's version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./plugins/gru953-studio/.claude-plugin/plugin.json').version")
          if [ "$TAG" != "$VER" ]; then
            echo "Tag v$TAG does not match plugin.json version $VER." >&2
            exit 1
          fi
          echo "Tag v$TAG matches plugin.json."
      - name: Build every release asset
        run: node tools/build-release-assets.mjs --out dist
      - name: Show what was built, and prove each archive is readable
        run: |
          ls -l dist
          for z in dist/*.zip; do unzip -tq "$z"; done
          cat dist/SHA256SUMS.txt
      - name: Attach the assets to the release (creating a draft if none exists yet)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::No release exists for $TAG yet — creating a DRAFT to hold the assets. A human still writes the notes and publishes it."
            gh release create "$TAG" --draft --title "$TAG" \
              --notes "Draft created automatically to hold the downloadable installers. Release notes are written by hand before this is published."
          fi
          gh release upload "$TAG" dist/* --clobber
          echo "Attached $(ls dist | wc -l) assets to $TAG."
