# The one test that proves the product does what it says: a real, unattended `claude -p` run that
# builds a small app from a plain-text idea, asserted against both the filesystem and the session
# transcript. See tools/e2e/headless-build.mjs for what it checks and why.
#
# WHY IT IS NOT IN ci.yml. It costs real money and real minutes per run, so it follows the cadence
# the owner chose: deterministic gates on every change, this one nightly and on demand. Running it
# per-push would make every pull request slow and expensive for a signal that changes rarely.
#
# IT IS NOW A HARD GATE ON RELEASES (2026-08-27). `publish.yml` calls this workflow with
# `require-measurement: true`, and both publishing jobs depend on it, so nothing reaches npm or a
# release page unless this ran and passed.
#
# The input is why that is safe to wire before the secret exists. Called WITHOUT it — the nightly,
# a manual dispatch — an absent ANTHROPIC_API_KEY ends this workflow GREEN with a warning, because
# a nightly alert that is always red is an alert nobody reads, and its absence when it matters is
# then invisible. Called WITH it, an absent secret FAILS. So a release cannot be published on a
# pass that measured nothing, which would be the same defect as a Definition of Done written by
# the work it grades — the defect this whole release removes.
#
# The consequence, stated plainly: until ANTHROPIC_API_KEY is configured, pushing a version tag
# will fail at this job. That is intended. It is the difference between a release that cannot be
# published and a release published without its one product-level proof.
#
# It distinguishes its own three outcomes, which is the point of running it unattended at all:
#   exit 0  the studio built working software
#   exit 1  the studio ran and the result is wrong  -> a real product defect
#   exit 2  it could not measure (a timeout, an incomplete run)
#
# 2026-08-26 correction. This comment used to claim exit 2 was "reported as a NEUTRAL result".
# That was wrong: the step ends in `exit $CODE`, and GitHub Actions treats every non-zero exit as
# a failure — there is no neutral outcome for a plain step. So with no credentials configured,
# every scheduled run would have been a red failure, every night, for a reason that is not a
# defect. A nightly alert that is always red is an alert nobody reads, and its absence when it
# matters is then invisible — the same lesson as the watchdog suppression rule in
# hooks/stall-check.mjs.
#
# Handled by SPLITTING the two cases instead of misdescribing one:
#   * no credentials  -> the harness is not run at all. The job reports plainly that the product
#                        was NOT MEASURED and ends green, because there is nothing wrong to
#                        report. It never claims a pass: the summary says "not measured".
#   * credentials set -> the harness runs, and any failure to measure IS then a real problem
#                        worth a red tick, because the one reason for it has been removed.
name: e2e (headless build)

on:
  schedule:
    # 03:20 UTC. Off the hour deliberately: scheduled runs bunch on the hour and get delayed.
    - cron: '20 3 * * *'
  workflow_dispatch:
    inputs:
      timeout-minutes:
        description: 'Minutes to allow the unattended build'
        required: false
        default: '90' # Tiny Tier only — a Complex brief measured >170 min on 2026-08-27
  # Callable, so publish.yml can depend on it (2026-08-27). `require-measurement` is the whole
  # point of the input: on the nightly, absent credentials must NOT be a red failure, because an
  # alert that is always red is an alert nobody reads. On a RELEASE, absent credentials must be a
  # hard failure, because "we did not measure" and "we measured and it passed" are the two things
  # this workflow exists to keep apart — and a release gate that passes by not measuring is the
  # exact defect 7.0.0 is about, one level up.
  workflow_call:
    inputs:
      timeout-minutes:
        required: false
        type: string
        default: '90'
      require-measurement:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  headless-build:
    name: build a small app from a plain-text idea, unattended
    runs-on: ubuntu-latest
    timeout-minutes: 120 # the harness's own 90 plus headroom for install and checks.
    # 2026-08-27: sized for the TINY brief this workflow runs. A Complex-Tier brief (sign-in,
    # database, TypeScript) reached 18 of 19 tasks and did NOT finish in 170 minutes — see
    # docs/RELEASING-7.0.0.md. Do not raise the default without raising this too.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Are there credentials to run with?
        id: creds
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          if [ -n "$KEY" ]; then
            echo "have=yes" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.require-measurement }}" = "true" ]; then
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::error::ANTHROPIC_API_KEY is not configured, and this run was asked to REQUIRE a measurement — so it fails rather than reporting an unmeasured pass. Add the secret in Settings > Secrets and variables > Actions."
            {
              echo '## Refusing to pass without measuring'
              echo ''
              echo 'This run was called with `require-measurement: true` (a release), and no'
              echo '`ANTHROPIC_API_KEY` secret is configured, so the unattended build could not run.'
              echo ''
              echo 'Reporting green here would mean publishing a release whose one product-level'
              echo 'proof never executed. That is the failure this workflow exists to prevent, so it'
              echo 'fails instead.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::warning::ANTHROPIC_API_KEY is not configured, so the product was NOT MEASURED tonight. This is not a pass and not a defect. Add the secret to make this workflow meaningful — publish.yml already depends on this workflow with require-measurement: true."
            {
              echo '## Not measured'
              echo ''
              echo 'No `ANTHROPIC_API_KEY` secret is configured, so the unattended build was not run.'
              echo ''
              echo '**This is not a pass.** Nothing was proven about the product tonight.'
              echo ''
              echo 'Add the secret in Settings → Secrets and variables → Actions, then this workflow'
              echo 'starts doing its job — and `needs: e2e` can be added to `publish.yml` so no release'
              echo 'is tagged without this proof.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run the unattended build and judge it
        if: steps.creds.outputs.have == 'yes'
        id: e2e
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set +e
          node tools/e2e/headless-build.mjs --timeout-minutes "${{ inputs.timeout-minutes || 90 }}"
          CODE=$?
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          case "$CODE" in
            0) echo "The studio built working software." ;;
            1) echo "::error::The studio ran and produced something wrong — a real product defect." ;;
            2) echo "::error::Could not measure, WITH credentials configured — so this is a real problem: a timeout, or a run that never completed." ;;
            *) echo "::error::Unexpected exit code $CODE from the harness itself." ;;
          esac
          exit "$CODE"

      - name: Restate the outcome plainly
        if: always()
        run: |
          if [ "${{ steps.creds.outputs.have }}" != "yes" ]; then
            echo "NOT MEASURED — no credentials configured. Not a pass."
          else
            echo "harness exit code: ${{ steps.e2e.outputs.code }}"
            echo "0 = built working software | 1 = product defect | 2 = could not measure"
          fi
