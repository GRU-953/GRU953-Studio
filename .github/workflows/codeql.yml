name: CodeQL

# Separate from ci.yml on purpose: CodeQL needs its own `security-events:
# write` permission (broader than CI needs) and reports to the Security tab
# rather than blocking a merge — the standard split. Scans the plugin's own
# hook scripts and all three clients/ bridges; JavaScript covers both plain
# .js and .mjs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, independent of any push, so a newly-disclosed CodeQL query
    # still catches an existing pattern nobody has touched recently.
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: '/language:javascript-typescript'
