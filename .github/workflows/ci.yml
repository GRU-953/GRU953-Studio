name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # One-off checks that don't depend on OS or Node version: JSON validity,
  # required files, and the DCO sign-off. Runs once, not once per matrix leg.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install repo dev tooling (ESLint, Prettier — dev-only, never shipped; see CONTRIBUTING.md)
        run: npm ci
      # 2026-08 audit round 1, Phase 1.1: this and the two steps below deliver
      # tooling a prior audit programme approved but never shipped. Scoped to
      # plugins/gru953-studio/hooks/ — the clients/ bridges already carry
      # their own separate lint setup, run in the `clients` job below.
      - name: Lint hook scripts (ESLint)
        run: npm run lint
      - name: Check hook script formatting (Prettier)
        run: npm run format:check
      - name: Syntax-check every script, not just the hooks (.mjs and .js, repo-wide)
        shell: bash
        run: |
          set -e
          find . -path ./node_modules -prune -o \
                 -path '*/node_modules' -prune -o \
                 -path './clients' -prune -o \
                 \( -name '*.mjs' -o -name '*.js' \) -print | while read -r f; do
            node --check "$f" && echo "$f OK"
          done
      - name: Validate JSON files parse
        run: |
          for f in .claude-plugin/marketplace.json \
                   plugins/gru953-studio/.claude-plugin/plugin.json \
                   plugins/gru953-studio/hooks/hooks.json \
                   package.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('$f OK')"
          done
      - name: Required files present
        run: |
          for f in LICENSE NOTICE SECURITY.md \
                   CODE_OF_CONDUCT.md CONTRIBUTING.md \
                   governance/TRADEMARKS.md governance/LOGO-USAGE.md governance/GOVERNANCE.md \
                   plugins/gru953-studio/ROSTER.md README.md; do
            test -f "$f" || (echo "Missing required file: $f" && exit 1)
          done
      - name: Every new commit carries a DCO sign-off
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD"
            else
              RANGE="$BASE..HEAD"
            fi
          fi
          MISSING=$(git log --no-merges --format='%H' $RANGE | while read -r sha; do
            git log -1 --format='%B' "$sha" | grep -q '^Signed-off-by:' || echo "$sha"
          done)
          if [ -n "$MISSING" ]; then
            echo "Commits missing a Signed-off-by (DCO) trailer:"; echo "$MISSING"; exit 1
          fi

  # 2026-07-26 audit stage 2. The whole point of this job: several of the
  # findings this stage fixed (CRLF frontmatter parsing, a Windows-only
  # path-comparison bug, PATHEXT-aware executable resolution) are platform-
  # shaped bugs that a Linux-only build can never reveal — which is exactly
  # how they survived. Breadth of Node versions matters less here than breadth
  # of operating system, since none of the fixed defects are Node-version
  # dependent; the matrix reflects that on purpose rather than testing every
  # combination of both axes.
  hooks:
    name: hooks (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  node: '20' }
          - { os: ubuntu-latest,  node: '22' }
          - { os: ubuntu-latest,  node: '24' }
          - { os: macos-latest,   node: '22' }
          - { os: windows-latest, node: '22' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Windows runners default the `run:` shell to PowerShell, not bash —
      # explicit here so this loop is the same shell on every leg.
      - name: Syntax-check every hook script
        shell: bash
        run: |
          for f in plugins/gru953-studio/hooks/*.mjs; do
            node --check "$f" && echo "$f OK"
          done
      - name: Behavioural test suite (hooks.test.mjs)
        run: node plugins/gru953-studio/hooks/hooks.test.mjs
      - name: Repository integrity check
        run: node plugins/gru953-studio/hooks/repo-integrity.mjs .
      - name: Roster check (role count vs committed baseline)
        run: node plugins/gru953-studio/hooks/roster-check.mjs plugins/gru953-studio .
      - name: Smoke-test the licence scanner
        run: node plugins/gru953-studio/hooks/licence-scan.mjs .
      - name: Documentation-consistency check
        run: node plugins/gru953-studio/hooks/docs-consistency.mjs .

  # 2026-08 audit round 2, Phase 2.2 (D3). Complements hooks.test.mjs's own
  # in-process toCrlf() simulation with a real, end-to-end proof: an actual
  # checkout, deliberately re-encoded to CRLF ON DISK afterwards (bypassing
  # .gitattributes' own `eol=lf` pin, which is what stops this happening by
  # ACCIDENT on a real Windows checkout — see .gitattributes' own header
  # comment), then the same six gates run against that genuinely-dirtied
  # tree. Runs on ubuntu-latest deliberately: the variable under test is
  # CRLF CONTENT, not the Windows checkout mechanism itself, which
  # .gitattributes already covers and the `hooks` job's own windows-latest
  # leg already exercises. Found a real bug the first time this was run:
  # docs-consistency.mjs's lifecycle-stage-count check located its target
  # paragraph with a literal `\n\n` for "blank line", which a CRLF file
  # never has (its blank lines are `\r\n\r\n`) — fixed in the same change
  # that added this job, never shipped as a known-broken leg.
  hooks-crlf:
    name: hooks-crlf (CRLF working tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Re-encode every tracked .md/.json/.mjs/.js/.yml/.yaml file to CRLF (deliberately, bypassing .gitattributes' eol=lf pin)
        shell: bash
        run: |
          set -e
          git ls-files -- '*.md' '*.json' '*.mjs' '*.js' '*.yml' '*.yaml' | while read -r f; do
            [ -f "$f" ] || continue
            perl -pi -e 's/\r?\n/\r\n/' "$f"
          done
      - name: Assert every rewritten file genuinely contains CRLF bytes on disk (the rewrite must not be a no-op)
        shell: bash
        run: |
          # NOT `git diff --quiet`: .gitattributes' `eol=lf` makes git apply its
          # own clean/normalize filter before diffing, so from git's point of
          # view a CRLF-on-disk file whose attribute says eol=lf reports NO
          # difference at all — proven live: the first version of this job used
          # `git diff --quiet` here and it reported "clean" (i.e. "no rewrite
          # happened") even though every file below genuinely has \r bytes on
          # disk, which is exactly why every prior step logged "CRLF will be
          # replaced by LF the next time Git touches it". Checking the raw bytes
          # directly, independent of git's own view, is the only way this
          # assertion can't be fooled by the same attribute that motivates the
          # whole job.
          set -e
          count=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if ! grep -qP '\r$' "$f"; then
              echo "Not CRLF-encoded on disk (rewrite failed or was skipped): $f" >&2
              exit 1
            fi
            count=$((count + 1))
          done < <(git ls-files -- '*.md' '*.json' '*.mjs' '*.js' '*.yml' '*.yaml')
          if [ "$count" -eq 0 ]; then
            echo "No files matched — this leg would be proving nothing." >&2
            exit 1
          fi
          echo "Confirmed $count files are genuinely CRLF-encoded on disk."
      - name: Syntax-check every hook script (still parses fine as CRLF)
        run: |
          for f in plugins/gru953-studio/hooks/*.mjs; do
            node --check "$f" && echo "$f OK"
          done
      - name: Behavioural test suite (hooks.test.mjs) against the CRLF-encoded repo
        run: node plugins/gru953-studio/hooks/hooks.test.mjs
      - name: Repository integrity check
        run: node plugins/gru953-studio/hooks/repo-integrity.mjs .
      - name: Roster check (role count vs committed baseline)
        run: node plugins/gru953-studio/hooks/roster-check.mjs plugins/gru953-studio .
      - name: Smoke-test the licence scanner
        run: node plugins/gru953-studio/hooks/licence-scan.mjs .
      - name: Documentation-consistency check
        run: node plugins/gru953-studio/hooks/docs-consistency.mjs .

  # 2026-07-26 audit stage 6. Separate from `hooks` on purpose: `npm ci` here
  # must never put node_modules into the hooks job's own workspace, and these
  # three packages (the CLI, the Antigravity bridge, and the VS Code
  # extension) are independent npm packages with their own lockfiles, not
  # part of the plugin's own zero-dependency runtime.
  clients:
    name: clients (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [cli, antigravity, vscode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: clients/${{ matrix.package }}
        run: npm ci
      - name: Run tests
        if: matrix.package != 'vscode'
        working-directory: clients/${{ matrix.package }}
        run: npm test
      - name: Compile and lint
        if: matrix.package == 'vscode'
        working-directory: clients/vscode
        run: |
          npm run compile
          npm run lint

  # A single, stable check name for branch protection to require, regardless
  # of how many legs the matrix above has (matrix job names are not stable
  # across edits to the matrix).
  ci-ok:
    name: CI
    if: always()
    needs: [static, hooks, hooks-crlf, clients]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        run: |
          echo '${{ toJSON(needs) }}'
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
