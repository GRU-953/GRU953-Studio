name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  # One-off checks that don't depend on OS or Node version: JSON validity,
  # required files, and the DCO sign-off. Runs once, not once per matrix leg.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install repo dev tooling (ESLint, Prettier — dev-only, never shipped; see CONTRIBUTING.md)
        run: npm ci
      # 2026-08 audit round 1, Phase 1.1: this and the two steps below deliver
      # tooling a prior audit programme approved but never shipped. Scoped to
      # plugins/gru953-studio/hooks/ — the clients/ bridges already carry
      # their own separate lint setup, run in the `clients` job below.
      - name: Lint hook scripts (ESLint)
        run: npm run lint
      - name: Check hook script formatting (Prettier)
        run: npm run format:check
      - name: Syntax-check every script, not just the hooks (.mjs and .js, repo-wide)
        shell: bash
        run: |
          set -e
          find . -path ./node_modules -prune -o \
                 -path '*/node_modules' -prune -o \
                 -path './clients' -prune -o \
                 \( -name '*.mjs' -o -name '*.js' \) -print | while read -r f; do
            node --check "$f" && echo "$f OK"
          done
      - name: Validate JSON files parse
        run: |
          for f in .claude-plugin/marketplace.json \
                   plugins/gru953-studio/.claude-plugin/plugin.json \
                   plugins/gru953-studio/hooks/hooks.json \
                   package.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('$f OK')"
          done
      - name: Required files present
        run: |
          for f in LICENSE NOTICE SECURITY.md \
                   CODE_OF_CONDUCT.md CONTRIBUTING.md \
                   governance/TRADEMARKS.md governance/LOGO-USAGE.md governance/GOVERNANCE.md \
                   plugins/gru953-studio/ROSTER.md README.md; do
            test -f "$f" || (echo "Missing required file: $f" && exit 1)
          done
      - name: Every new commit carries a DCO sign-off
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD"
            else
              RANGE="$BASE..HEAD"
            fi
          fi
          MISSING=$(git log --no-merges --format='%H' $RANGE | while read -r sha; do
            git log -1 --format='%B' "$sha" | grep -q '^Signed-off-by:' || echo "$sha"
          done)
          if [ -n "$MISSING" ]; then
            echo "Commits missing a Signed-off-by (DCO) trailer:"; echo "$MISSING"; exit 1
          fi

  # 2026-07-26 audit stage 2. The whole point of this job: several of the
  # findings this stage fixed (CRLF frontmatter parsing, a Windows-only
  # path-comparison bug, PATHEXT-aware executable resolution) are platform-
  # shaped bugs that a Linux-only build can never reveal — which is exactly
  # how they survived. Breadth of Node versions matters less here than breadth
  # of operating system, since none of the fixed defects are Node-version
  # dependent; the matrix reflects that on purpose rather than testing every
  # combination of both axes.
  hooks:
    name: hooks (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 2026-07-31 sitting-5 maintenance fix: Node 20 reached end of life
          # on 2026-04-30 (nodejs/Release schedule.json) — dropped rather than
          # tested. Node 26 becomes LTS on 2026-10-28; deferred until then
          # rather than added early, per the same audit's decision.
          - { os: ubuntu-latest,  node: '22' }
          - { os: ubuntu-latest,  node: '24' }
          - { os: macos-latest,   node: '22' }
          - { os: windows-latest, node: '22' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # Windows runners default the `run:` shell to PowerShell, not bash —
      # explicit here so this loop is the same shell on every leg.
      - name: Syntax-check every hook script
        shell: bash
        run: |
          for f in plugins/gru953-studio/hooks/*.mjs; do
            node --check "$f" && echo "$f OK"
          done
      - name: Behavioural test suite (hooks.test.mjs)
        run: node plugins/gru953-studio/hooks/hooks.test.mjs
      - name: Repository integrity check
        run: node plugins/gru953-studio/hooks/repo-integrity.mjs .
      - name: Roster check (role count vs committed baseline)
        run: node plugins/gru953-studio/hooks/roster-check.mjs plugins/gru953-studio .
      - name: Smoke-test the licence scanner
        run: node plugins/gru953-studio/hooks/licence-scan.mjs .
      - name: Documentation-consistency check
        run: node plugins/gru953-studio/hooks/docs-consistency.mjs .
      - name: Operating-charter consistency check
        run: node plugins/gru953-studio/hooks/charter-check.mjs .

  # 2026-08 audit round 2, Phase 2.2 (D3). Complements hooks.test.mjs's own
  # in-process toCrlf() simulation with a real, end-to-end proof: an actual
  # checkout, deliberately re-encoded to CRLF ON DISK afterwards (bypassing
  # .gitattributes' own `eol=lf` pin, which is what stops this happening by
  # ACCIDENT on a real Windows checkout — see .gitattributes' own header
  # comment), then the same six gates run against that genuinely-dirtied
  # tree. Runs on ubuntu-latest deliberately: the variable under test is
  # CRLF CONTENT, not the Windows checkout mechanism itself, which
  # .gitattributes already covers and the `hooks` job's own windows-latest
  # leg already exercises. Found a real bug the first time this was run:
  # docs-consistency.mjs's lifecycle-stage-count check located its target
  # paragraph with a literal `\n\n` for "blank line", which a CRLF file
  # never has (its blank lines are `\r\n\r\n`) — fixed in the same change
  # that added this job, never shipped as a known-broken leg.
  hooks-crlf:
    name: hooks-crlf (CRLF working tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Re-encode every tracked .md/.json/.mjs/.js/.yml/.yaml file to CRLF (deliberately, bypassing .gitattributes' eol=lf pin)
        shell: bash
        run: |
          set -e
          git ls-files -- '*.md' '*.json' '*.mjs' '*.js' '*.yml' '*.yaml' | while read -r f; do
            [ -f "$f" ] || continue
            perl -pi -e 's/\r?\n/\r\n/' "$f"
          done
      - name: Assert every rewritten file genuinely contains CRLF bytes on disk (the rewrite must not be a no-op)
        shell: bash
        run: |
          # NOT `git diff --quiet`: .gitattributes' `eol=lf` makes git apply its
          # own clean/normalize filter before diffing, so from git's point of
          # view a CRLF-on-disk file whose attribute says eol=lf reports NO
          # difference at all — proven live: the first version of this job used
          # `git diff --quiet` here and it reported "clean" (i.e. "no rewrite
          # happened") even though every file below genuinely has \r bytes on
          # disk, which is exactly why every prior step logged "CRLF will be
          # replaced by LF the next time Git touches it". Checking the raw bytes
          # directly, independent of git's own view, is the only way this
          # assertion can't be fooled by the same attribute that motivates the
          # whole job.
          set -e
          count=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if ! grep -qP '\r$' "$f"; then
              echo "Not CRLF-encoded on disk (rewrite failed or was skipped): $f" >&2
              exit 1
            fi
            count=$((count + 1))
          done < <(git ls-files -- '*.md' '*.json' '*.mjs' '*.js' '*.yml' '*.yaml')
          if [ "$count" -eq 0 ]; then
            echo "No files matched — this leg would be proving nothing." >&2
            exit 1
          fi
          echo "Confirmed $count files are genuinely CRLF-encoded on disk."
      - name: Syntax-check every hook script (still parses fine as CRLF)
        run: |
          for f in plugins/gru953-studio/hooks/*.mjs; do
            node --check "$f" && echo "$f OK"
          done
      - name: Behavioural test suite (hooks.test.mjs) against the CRLF-encoded repo
        run: node plugins/gru953-studio/hooks/hooks.test.mjs
      - name: Repository integrity check
        run: node plugins/gru953-studio/hooks/repo-integrity.mjs .
      - name: Roster check (role count vs committed baseline)
        run: node plugins/gru953-studio/hooks/roster-check.mjs plugins/gru953-studio .
      - name: Smoke-test the licence scanner
        run: node plugins/gru953-studio/hooks/licence-scan.mjs .
      - name: Documentation-consistency check
        run: node plugins/gru953-studio/hooks/docs-consistency.mjs .
      - name: Operating-charter consistency check
        run: node plugins/gru953-studio/hooks/charter-check.mjs .

  # 2026-07-26 audit stage 6. Separate from `hooks` on purpose: `npm ci` here
  # must never put node_modules into the hooks job's own workspace, and these
  # three packages (the CLI, the Antigravity bridge, and the VS Code
  # extension) are independent npm packages with their own lockfiles, not
  # part of the plugin's own zero-dependency runtime.
  clients:
    name: clients (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [cli, antigravity, vscode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: clients/${{ matrix.package }}
        run: npm ci
      - name: Run tests
        if: matrix.package != 'vscode'
        working-directory: clients/${{ matrix.package }}
        run: npm test
      # 2026-07-29 maintenance fix (audit finding 7): cli and antigravity had
      # no lint step at all — the repo-wide `node --check` sweep above
      # explicitly prunes `./clients`, so nothing here was syntax/lint-checked
      # by CI beyond whatever `npm test` happened to import. Mirrors vscode's
      # own lint step below, just without a compile step (plain JS, no TS).
      - name: Lint
        if: matrix.package == 'cli' || matrix.package == 'antigravity'
        working-directory: clients/${{ matrix.package }}
        run: npm run lint
      - name: Compile and lint
        if: matrix.package == 'vscode'
        working-directory: clients/vscode
        run: |
          npm run compile
          npm run lint

  # 2026-08-10, with the release installers. Builds every downloadable asset on
  # EVERY pull request, not only on a release tag. The reason is specific: before
  # this, packaging ran for the first time during a release, which is the worst
  # moment to discover a broken package — the tag is already pushed and the
  # version already claimed. Building here means a packaging defect fails a PR
  # like any other defect.
  #
  # The .vsix is included: it is the one asset whose build shells out to another
  # tool (@vscode/vsce) and therefore the one most likely to break from the
  # outside.
  packaging:
    name: packaging (all release assets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install the VS Code extension's dependencies (needed to package the .vsix)
        working-directory: clients/vscode
        run: npm ci
      - name: Build every release asset
        run: node tools/build-release-assets.mjs --out dist
      - name: Every archive must be readable, and structurally right
        shell: bash
        run: |
          set -e
          for z in dist/*.zip; do unzip -tq "$z"; done
          VER=$(node -p "require('./plugins/gru953-studio/.claude-plugin/plugin.json').version")
          # The Claude packages must carry the plugin manifest at the package root,
          # or neither Claude Code nor Claude Desktop recognises them as a plugin.
          for target in claude-code claude-desktop; do
            unzip -Z1 "dist/gru953-studio-$target-$VER.zip" | grep -qx 'gru953-studio/.claude-plugin/plugin.json' \
              || { echo "$target package is missing plugin.json at its root" >&2; exit 1; }
            unzip -Z1 "dist/gru953-studio-$target-$VER.zip" | grep -qx 'INSTALL.txt' \
              || { echo "$target package is missing its install guide" >&2; exit 1; }
          done
          # Antigravity uses a different layout, and must NOT contain agents/ or
          # commands/ — it has no such component, so either would be a directory
          # it silently ignores.
          AG="dist/gru953-studio-antigravity-$VER.zip"
          unzip -Z1 "$AG" | grep -qx 'gru953-studio/plugin.json' || { echo "Antigravity package needs plugin.json at its root" >&2; exit 1; }
          unzip -Z1 "$AG" | grep -qx 'gru953-studio/rules/gru953-roster.md' || { echo "Antigravity package is missing the roster rule" >&2; exit 1; }
          if unzip -Z1 "$AG" | grep -qE '^gru953-studio/(agents|commands)/'; then
            echo "Antigravity package must not contain agents/ or commands/" >&2; exit 1
          fi
          test -f "dist/gru953-studio-$VER.vsix" || { echo "the .vsix was not built" >&2; exit 1; }
          # Checksums must cover every asset, or the file gives false assurance.
          ASSETS=$(ls dist | grep -v '^SHA256SUMS.txt$' | wc -l | tr -d ' ')
          SUMS=$(wc -l < dist/SHA256SUMS.txt | tr -d ' ')
          [ "$ASSETS" = "$SUMS" ] || { echo "SHA256SUMS.txt has $SUMS lines for $ASSETS assets" >&2; exit 1; }
          echo "All $ASSETS release assets built and verified."
      - name: The build must be reproducible (same source, byte-identical archives)
        shell: bash
        run: |
          set -e
          # Not a nicety: the published SHA256SUMS is only worth something if the
          # same source always produces the same bytes. tools/lib/zip.mjs stamps a
          # fixed timestamp for exactly this reason, and this proves it holds.
          node tools/build-release-assets.mjs --skip-vsix --out dist2
          for z in dist2/*.zip; do
            base=$(basename "$z")
            cmp "$z" "dist/$base" || { echo "$base is not reproducible" >&2; exit 1; }
          done
          echo "Every archive rebuilt byte-identically."

  # 2026-08-10. Runs the universal installer end to end against a THROWAWAY home
  # directory on all three operating systems. Everything it touches is inside that
  # directory, so a CI runner is never left modified.
  #
  # This is the job that would have caught the PATH defect found by hand during
  # development (the advice named the package's own src/ directory instead of
  # npm's bin folder), and it is the only automated coverage of the Windows and
  # Linux install paths actually running rather than being simulated.
  installer:
    name: installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Unit tests for every installer module
        working-directory: clients/cli
        run: |
          npm ci
          npm test
      - name: doctor runs and reports, on a machine with no AI tools installed
        shell: bash
        run: |
          # A fresh runner has none of the supported hosts, so this also proves the
          # "nothing found" path reports honestly instead of crashing or claiming
          # success. doctor exits non-zero only when something ESSENTIAL is
          # missing; Node and git are present on every runner, so it must pass.
          node clients/cli/src/index.js doctor
      - name: install into a throwaway home, then uninstall again
        shell: bash
        run: |
          set -e
          FAKE="$RUNNER_TEMP/fakehome"
          mkdir -p "$FAKE/.claude" "$FAKE/.gemini/config"
          if [ "$RUNNER_OS" = "Windows" ]; then
            export USERPROFILE="$FAKE"
          fi
          export HOME="$FAKE"
          node clients/cli/src/index.js install
          # Claude Code and Antigravity are the two documented-location hosts, so
          # both must genuinely be installed. Claude Desktop is expected to be
          # skipped — Anthropic documents installing through the app.
          test -e "$FAKE/.claude/plugins/gru953-studio" || { echo "Claude Code install did not land" >&2; exit 1; }
          test -f "$FAKE/.gemini/config/plugins/gru953-studio/plugin.json" || { echo "Antigravity plugin.json missing" >&2; exit 1; }
          test -f "$FAKE/.gemini/config/plugins/gru953-studio/rules/gru953-roster.md" || { echo "Antigravity roster rule missing" >&2; exit 1; }
          node clients/cli/src/index.js uninstall
          test ! -e "$FAKE/.claude/plugins/gru953-studio" || { echo "uninstall left the Claude Code install behind" >&2; exit 1; }
          echo "install and uninstall both verified on $RUNNER_OS."
      - name: the repo checkout must be untouched by an install into a fake home
        shell: bash
        run: |
          # A linked install points AT the checkout, so an uninstall that followed
          # the link instead of removing it would delete the plugin's own source.
          # This is the assertion that would catch that.
          test -f plugins/gru953-studio/.claude-plugin/plugin.json || { echo "the checkout was damaged" >&2; exit 1; }
          test -d plugins/gru953-studio/skills || { echo "the checkout's skills are gone" >&2; exit 1; }
          git diff --quiet || { echo "the working tree was modified:" >&2; git status --short >&2; exit 1; }
          echo "Checkout intact."

  # A single, stable check name for branch protection to require, regardless
  # of how many legs the matrix above has (matrix job names are not stable
  # across edits to the matrix).
  ci-ok:
    name: CI
    if: always()
    needs: [static, hooks, hooks-crlf, clients, packaging, installer]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        run: |
          echo '${{ toJSON(needs) }}'
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]] || [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
