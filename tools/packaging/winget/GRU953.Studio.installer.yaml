# winget installer manifest. NOT YET SUBMITTED — see ../README.md for why.
#
# 2026-08-11 rewrite, after a real mistake was caught before it reached anyone.
# The first version of this file declared a `gru953-studio` command and pointed at
# gru953-studio-claude-code-<version>.zip. That archive holds 128 markdown files
# and no executable of any kind — it is the plugin, not the command. winget would
# have rejected it, and submitting it would have wasted Microsoft's reviewers' time
# on a package that could never have worked. Verified by downloading the published
# archive and looking inside, not by reading the build script.
#
# What is correct instead:
#   * InstallerType: zip with NestedInstallerType: portable, so winget places one
#     named file on the PATH (schema 1.12.0 confirms both fields, and that
#     PortableCommandAlias is only valid for a portable nested type).
#
# 2026-08-11, second correction, from Microsoft's own validation rather than from
# reading: these were first written against schema 1.6.0. The CURRENT specification
# is 1.12.0, and the old schema URLs still resolve — so validating against 1.6.0
# passed while the submission failed. Checking a manifest against a version of the
# spec nobody uses any more is not validation. Diffing 1.6.0 against 1.12.0 then
# surfaced ArchiveBinariesDependOnPath, which this package actually needs.
#   * The archive is gru953-studio-windows-portable-<version>.zip, which contains a
#     .cmd shim plus the CLI — built by tools/build-release-assets.mjs.
#   * Node.js is declared as a PackageDependency rather than bundled. The CLI is a
#     Node script, and winget's portable type installs no runtime; bundling a second
#     Node for a machine that probably already has one is the wrong trade.
#     OpenJS.NodeJS was confirmed to exist in winget-pkgs before being depended on.
#
# TWO VALUES MUST BE SET AT RELEASE TIME, and the manifest is invalid until they are:
#   1. PackageVersion and the version inside InstallerUrl — the release that actually
#      carries the archive.
#   2. InstallerSha256 — winget verifies the exact bytes it downloads:
#        shasum -a 256 dist/gru953-studio-windows-portable-<version>.zip
#      The same value is published in that release's SHA256SUMS.txt.
#
# Why they cannot be filled in yet: this repository publishes IMMUTABLE releases, so
# assets cannot be added to v6.0.0 after the fact (confirmed: GitHub returns HTTP 422,
# "Cannot upload assets to an immutable release"). The archive therefore ships with the
# next release, and these two lines are set then.
PackageIdentifier: GRU953.Studio
PackageVersion: 6.0.1
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: gru953-studio.cmd
    PortableCommandAlias: gru953-studio
# The launcher loads the CLI from src/ beside itself via %~dp0, so it only works
# from the folder it was extracted into. With the default (false) winget puts an
# alias in its own links directory, and a .cmd invoked through that resolves %~dp0
# to the alias's location, where src/ does not exist. Adding the install location
# to PATH instead is what makes a script with sibling files work. Field added in
# manifest schema 1.12.0.
ArchiveBinariesDependOnPath: true
Dependencies:
  PackageDependencies:
    - PackageIdentifier: OpenJS.NodeJS
Installers:
  - Architecture: neutral
    InstallerUrl: https://github.com/GRU-953/GRU953-Studio/releases/download/v6.0.1/gru953-studio-windows-portable-6.0.1.zip
    InstallerSha256: 5E9EA972E08EB7F831CE6DE6F7FAA34F58178BAE8A17363B873CDAF14BFDFDA7
ManifestType: installer
ManifestVersion: 1.12.0
